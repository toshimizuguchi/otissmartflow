<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#162035" />
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1a2e" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Neon Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#06b6d4" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="8 6" />

  <!-- Inner Badge Plate -->
  <circle cx="256" cy="256" r="160" fill="url(#badge)" stroke="url(#cyanGrad)" stroke-width="6" />

  <!-- Technical Field / GPS Hexagon -->
  <polygon points="256,150 336,196 336,288 256,334 176,288 176,196" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round" />

  <!-- GPS Target Rings -->
  <circle cx="256" cy="242" r="54" fill="none" stroke="#f0f9ff" stroke-width="5" />
  <circle cx="256" cy="242" r="22" fill="#38bdf8" />
  <circle cx="256" cy="242" r="8" fill="#ffffff" />

  <!-- GPS Crosshairs -->
  <line x1="256" y1="166" x2="256" y2="202" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="282" x2="256" y2="318" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <line x1="180" y1="242" x2="216" y2="242" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <line x1="296" y1="242" x2="332" y2="242" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

  <!-- Operational Pulse Arc -->
  <path d="M 200 376 C 220 388, 292 388, 312 376" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
  <circle cx="256" cy="382" r="4" fill="#10b981" />
</svg>
